<section class="confirmation" aria-labelledby="confirmation-heading">
  <div class="icon" aria-hidden="true">?</div>
  <div>
    <span>Confirmation required</span>
    <h2 id="confirmation-heading">Move appointment from {{ data().fromDay }} {{ data().fromTime }} to {{ data().toDay }} {{ data().toTime }}?</h2>
    <p>{{ data().patientName }} · The change will only happen after you confirm.</p>
  </div>
  <div class="actions">
    <button class="secondary" type="button" (click)="cancel()">Cancel</button>
    <button class="primary" type="button" (click)="confirm()">Confirm move <span>→</span></button>
  </div>
</section>
